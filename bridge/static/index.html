<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>spool-bridge</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%232557a7'/%3E%3Ccircle cx='16' cy='16' r='5' fill='white'/%3E%3C/svg%3E">
<style>
  :root { --bg:#f5f5f3; --card:#fff; --ink:#1c1c1a; --mute:#6b6b66; --line:#e2e1dc; --soft:#efeee9;
          --ok:#2f7d4f; --warn:#a86500; --err:#b3261e; --acc:#2557a7; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#141413; --card:#1e1e1c; --ink:#ecebe6; --mute:#9a9992; --line:#33322e; --soft:#262623; }
  }
  * { box-sizing:border-box; }
  body { margin:0; font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif; background:var(--bg); color:var(--ink); }
  main { max-width:1080px; margin:0 auto; padding:20px 16px 48px; }
  header { display:flex; align-items:baseline; gap:12px; margin-bottom:16px; }
  h1 { font-size:20px; margin:0; }
  h2 { font-size:15px; margin:0 0 12px; display:flex; gap:8px; align-items:center; }
  .mute { color:var(--mute); } .small { font-size:12px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px; margin-bottom:16px; }
  .dot { width:9px; height:9px; border-radius:50%; display:inline-block; flex:none; }
  .sw { width:16px; height:16px; border-radius:4px; border:1px solid var(--line); display:inline-block; flex:none; }
  .grid2 { display:grid; grid-template-columns: minmax(0,1fr) minmax(0,1fr); gap:16px; }
  @media (max-width: 820px) { .grid2 { grid-template-columns:1fr; } }
  button, select, input { font:inherit; padding:6px 10px; border-radius:7px; border:1px solid var(--line); background:var(--card); color:var(--ink); }
  button { cursor:pointer; } button.primary { background:var(--acc); border-color:var(--acc); color:#fff; }
  button:disabled { opacity:.5; cursor:default; }

  /* Waage */
  .scale { display:grid; grid-template-columns: minmax(180px, 240px) minmax(0,1fr); gap:20px; align-items:center; }
  @media (max-width: 620px) { .scale { grid-template-columns:1fr; } }
  .weight { font-size:52px; font-weight:650; letter-spacing:-1px; font-variant-numeric:tabular-nums; line-height:1; }
  .weight small { font-size:22px; font-weight:500; color:var(--mute); margin-left:4px; }
  .spoolbox { border:1px solid var(--line); border-radius:10px; padding:12px 14px; min-height:96px; }
  .spoolbox .name { font-size:17px; font-weight:600; display:flex; gap:8px; align-items:center; }
  .bar { height:8px; background:var(--soft); border-radius:4px; overflow:hidden; margin:8px 0 4px; }
  .bar > i { display:block; height:100%; background:var(--ok); }
  .bar.low > i { background:var(--warn); } .bar.empty > i { background:var(--err); }
  .tools { display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-top:14px; padding-top:12px; border-top:1px solid var(--line); }
  .tools input { width:100px; }

  /* Drucker */
  .slots { display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:8px; }
  .slot { border:1px solid var(--line); border-radius:8px; padding:8px 10px; min-height:64px; position:relative; }
  .slot .n { font-size:12px; color:var(--mute); display:flex; justify-content:space-between; }
  .slot .assign { margin-top:6px; display:none; gap:4px; }
  .slot:hover .assign, .slot:focus-within .assign { display:flex; }
  .slot .assign select { flex:1; min-width:0; font-size:12px; padding:3px; }
  .slot .assign button { font-size:12px; padding:3px 8px; }
  .armed { background:color-mix(in srgb, var(--acc) 12%, transparent); border:1px solid var(--acc); padding:8px 10px; border-radius:8px; margin-bottom:10px; }

  /* Neuer Tag */
  .unknown { border-color:var(--warn); background:color-mix(in srgb, var(--warn) 7%, var(--card)); }
  .unknown select { max-width:100%; }

  /* Lager */
  .invtools { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:10px; }
  .invtools input { flex:1; min-width:160px; }
  table { width:100%; border-collapse:collapse; }
  th, td { text-align:left; padding:7px 6px; border-top:1px solid var(--line); vertical-align:middle; }
  th { font-size:12px; color:var(--mute); font-weight:500; border-top:0; }
  td.num { text-align:right; font-variant-numeric:tabular-nums; white-space:nowrap; }
  tr.group td { background:var(--soft); font-size:12px; color:var(--mute); font-weight:600; padding:5px 6px; }
  .mini { width:70px; height:6px; background:var(--soft); border-radius:3px; overflow:hidden; display:inline-block; vertical-align:middle; margin-left:8px; }
  .mini > i { display:block; height:100%; background:var(--ok); }
  .mini.low > i { background:var(--warn); } .mini.empty > i { background:var(--err); }
  @media (max-width: 520px) { .mini { display:none; } }

  /* Ereignisse */
  ul.ev { list-style:none; margin:0; padding:0; }
  ul.ev li { padding:6px 0; border-top:1px solid var(--line); display:flex; gap:10px; }
  ul.ev li:first-child { border-top:0; }
  .t { color:var(--mute); font-variant-numeric:tabular-nums; min-width:64px; }
  .ok { color:var(--ok); } .warn { color:var(--warn); } .error { color:var(--err); }
  details summary { cursor:pointer; color:var(--mute); font-size:13px; margin-top:6px; }
</style>
</head>
<body>
<main>
  <header><h1>spool-bridge</h1><span class="mute small" id="ver"></span></header>

  <div id="unknown"></div>
  <div id="scales"></div>
  <div id="printers"></div>

  <div class="grid2">
    <section class="card">
      <h2>Lager <span class="mute small" id="invcount"></span></h2>
      <div class="invtools">
        <input id="q" type="search" placeholder="Suchen (Material, Farbe, Ort …)">
        <select id="grp">
          <option value="location">nach Ort</option>
          <option value="material">nach Material</option>
          <option value="none">ohne Gruppen</option>
        </select>
      </div>
      <table><thead><tr><th></th><th>Spule</th><th class="num">Rest</th><th>Ort</th></tr></thead>
        <tbody id="inv"></tbody></table>
    </section>
    <section class="card">
      <h2>Ereignisse</h2>
      <ul class="ev" id="events"></ul>
      <details id="moreev"><summary>ältere anzeigen</summary><ul class="ev" id="events-old"></ul></details>
    </section>
  </div>
</main>
<script>
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmtG = (g) => (g === null || g === undefined || isNaN(g)) ? "–" : Math.round(g).toLocaleString("de-CH");
const sw = (hex) => hex ? `<span class="sw" style="background:#${esc(hex)}"></span>` : `<span class="sw"></span>`;
let state = null, busy = false;
const sig = {};  // letzter gerenderter Stand je Bereich (verhindert Flackern/Fokusverlust)

async function post(url, body) {
  const r = await fetch(url, {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(body)});
  return r.json().catch(() => ({}));
}
function changed(key, value) {
  const s = JSON.stringify(value);
  if (sig[key] === s) return false;
  sig[key] = s; return true;
}
function level(rem, total) {
  if (rem === null || rem === undefined || !total) return {pct: 0, cls: ""};
  const pct = Math.max(0, Math.min(100, rem / total * 100));
  return {pct, cls: pct <= 5 ? "empty" : pct <= 20 ? "low" : ""};
}

/* ---------- Neuer Tag ---------- */
function renderUnknown(st) {
  const u = st.unknown;
  if (!changed("unknown", u ? [u.uid, st.filaments.length, st.spools.length] : null)) return;
  const el = $("#unknown");
  if (!u) { el.innerHTML = ""; return; }
  el.innerHTML = `<div class="card unknown"><h2><span class="dot" style="background:var(--warn)"></span>Neuer Tag erkannt</h2>
    <p style="margin:0 0 10px">Tag <b>${esc(u.uid)}</b> (Leser ${esc(u.reader)}${u.weight ? `, ${fmtG(u.weight)} g` : ""}) ist noch keiner Spule zugeordnet.</p>
    <select id="linkSel"><option value="">Spule oder Filament wählen …</option>
      <optgroup label="Neue Spule anlegen aus Filament">${(st.filaments||[]).map(f => `<option value="f:${f.id}">${esc(f.label)}</option>`).join("")}</optgroup>
      <optgroup label="Bestehende Spule">${st.spools.map(s => `<option value="s:${s.id}">${esc(s.label)}</option>`).join("")}</optgroup>
    </select> <button class="primary" id="linkBtn">Verknüpfen</button></div>`;
  $("#linkBtn").onclick = async () => {
    const v = $("#linkSel").value; if (!v) return;
    const [kind, id] = v.split(":");
    busy = true;
    await post("/api/link", kind === "f" ? {uid:u.uid, filament_id:Number(id)} : {uid:u.uid, spool_id:Number(id)});
    busy = false; sig.unknown = null; refresh();
  };
}

/* ---------- Waagen ---------- */
function renderScales(st) {
  const root = $("#scales");
  const readers = st.scales.map(s => s.reader);
  if (changed("scaleset", readers)) {
    if (!st.scales.length) {
      root.innerHTML = `<section class="card"><h2><span class="dot" style="background:var(--mute)"></span>Waage</h2>
        <span class="mute">Noch keine Waage gemeldet. Sobald die Waage-Firmware läuft, erscheint hier das Live-Gewicht.</span></section>`;
      return;
    }
    root.innerHTML = st.scales.map(s => `
      <section class="card" id="sc-${esc(s.reader)}">
        <h2><span class="dot" data-f="dot"></span>Waage <span class="mute small">${esc(s.reader)}${s.printer ? " → " + esc(s.printer) : ""}</span></h2>
        <div class="scale">
          <div><div class="weight" data-f="weight">–</div><div class="mute small" data-f="sub"></div></div>
          <div class="spoolbox" data-f="spool"></div>
        </div>
        <div class="tools">
          <button data-a="tare">Tara</button>
          <span class="mute small">Kalibrieren mit</span>
          <input type="number" min="10" max="5000" step="1" placeholder="Gramm" data-a="grams">
          <button data-a="cal">Kalibrieren</button>
          <span class="mute small" data-f="pending"></span>
        </div>
      </section>`).join("");
    for (const s of st.scales) {
      const box = $(`#sc-${CSS.escape(s.reader)}`);
      box.querySelector('[data-a="tare"]').onclick = () => post("/api/scale", {reader:s.reader, cmd:"tare"}).then(refresh);
      box.querySelector('[data-a="cal"]').onclick = () => {
        const g = Number(box.querySelector('[data-a="grams"]').value);
        if (!g) { box.querySelector('[data-a="grams"]').focus(); return; }
        post("/api/scale", {reader:s.reader, cmd:"calibrate", grams:g}).then(refresh);
      };
    }
  }
  for (const s of st.scales) {
    const box = $(`#sc-${CSS.escape(s.reader)}`); if (!box) continue;
    const f = (n) => box.querySelector(`[data-f="${n}"]`);
    f("dot").style.background = s.online ? "var(--ok)" : "var(--err)";
    const w = s.weight;
    f("weight").innerHTML = (w === null || w === undefined) ? "–" : `${fmtG(w)}<small>g</small>`;
    f("sub").textContent = !s.online ? "Waage nicht erreichbar"
      : (w === null || w === undefined) ? "nicht kalibriert – Tara, dann Kalibrieren"
      : w < 30 ? "Teller leer" : "brutto, inkl. Spule";
    f("pending").textContent = s.pending ? "Befehl wird an die Waage übertragen …" : "";
    let html;
    if (s.spool) {
      const sp = s.spool, lv = level(sp.remaining, sp.total);
      html = `<div class="name">${sw(sp.color)}${esc(sp.label)}</div>
        <div class="mute small">${esc(sp.vendor)}${sp.location ? " · " + esc(sp.location) : ""}</div>
        <div class="bar ${lv.cls}"><i style="width:${lv.pct}%"></i></div>
        <div><b>${fmtG(sp.remaining)} g</b> Rest${sp.total ? ` von ${fmtG(sp.total)} g` : ""}
          <span class="mute small">${sp.empty !== null && sp.empty !== undefined ? ` · Leerspule ${fmtG(sp.empty)} g` : " · Leergewicht fehlt in Spoolman!"}</span></div>`;
    } else if (s.unknown_tag) {
      html = `<div class="name warn">Neuer Tag</div><div class="mute small">oben einer Spule oder einem Filament zuweisen</div>`;
    } else if (s.uid) {
      html = `<div class="mute">Tag ${esc(s.uid)} wird gelesen …</div>`;
    } else {
      html = `<div class="mute">Keine Spule auf der Waage.<br><span class="small">Spule mit Tag nach unten auflegen.</span></div>`;
    }
    if (f("spool").innerHTML !== html) f("spool").innerHTML = html;
  }
}

/* ---------- Drucker ---------- */
function renderPrinters(st) {
  if (!changed("printers", [st.printers, st.spools])) return;
  if (document.activeElement && document.activeElement.closest && document.activeElement.closest(".assign")) { sig.printers = null; return; }
  const spoolOpts = '<option value="">Spule wählen …</option>' + st.spools.map(s => `<option value="${s.id}">${esc(s.label)}</option>`).join("");
  $("#printers").innerHTML = st.printers.map(p => {
    const dot = `<span class="dot" style="background:${p.connected ? "var(--ok)" : "var(--err)"}"></span>`;
    if (p.type === "moonraker") {
      return `<section class="card"><h2>${dot}${esc(p.name)} <span class="mute small">Klipper</span></h2>
        ${p.spool ? `Aktive Spule: <b>${esc(p.spool)}</b>` : '<span class="mute">keine aktive Spule</span>'}</section>`;
    }
    const armed = p.armed ? `<div class="armed"><b>${esc(p.armed_label || "Spule")}</b> bereit – jetzt in einen AMS-Slot stecken</div>` : "";
    const slots = p.slots.map(s => `<div class="slot">
        <div class="n"><span>${esc(s.name)}</span><span>${s.occupied ? "belegt" : "leer"}</span></div>
        ${s.occupied
          ? `<div style="display:flex;gap:6px;align-items:flex-start;margin-top:2px">${sw(s.color)}<span>${esc(s.spool || s.type || "?")}</span></div>
             ${s.spool ? "" : '<div class="mute small">nicht in Spoolman zugeordnet</div>'}
             <div class="assign"><select data-p="${esc(p.name)}" data-a="${s.ams_id}" data-s="${s.slot}">${spoolOpts}</select><button>Setzen</button></div>`
          : '<div class="mute">–</div>'}</div>`).join("");
    return `<section class="card"><h2>${dot}${esc(p.name)} <span class="mute small">${p.connected ? "verbunden" : "nicht verbunden"}</span></h2>${armed}
      <div class="slots">${slots || '<span class="mute">Noch keine AMS-Daten</span>'}</div></section>`;
  }).join("");
  document.querySelectorAll(".assign button").forEach(b => b.onclick = async () => {
    const sel = b.previousElementSibling; if (!sel.value) return;
    busy = true;
    await post("/api/assign", {printer:sel.dataset.p, ams_id:Number(sel.dataset.a), slot:Number(sel.dataset.s), spool_id:Number(sel.value)});
    busy = false; sig.printers = null; refresh();
  });
}

/* ---------- Lager ---------- */
function renderInventory(st) {
  const q = $("#q").value.trim().toLowerCase(), grp = $("#grp").value;
  if (!changed("inv", [st.inventory, q, grp])) return;
  const items = st.inventory.filter(s => !q || [s.label, s.vendor, s.location].join(" ").toLowerCase().includes(q));
  $("#invcount").textContent = `${items.length} Spule${items.length === 1 ? "" : "n"}`;
  const keyOf = (s) => grp === "material" ? (s.label.split(" ")[0] || "–") : grp === "location" ? (s.location || "ohne Ort") : "";
  const sorted = [...items].sort((a, b) => keyOf(a).localeCompare(keyOf(b), "de") || a.label.localeCompare(b.label, "de"));
  let html = "", last = null;
  for (const s of sorted) {
    const k = keyOf(s);
    if (grp !== "none" && k !== last) { html += `<tr class="group"><td colspan="4">${esc(k)}</td></tr>`; last = k; }
    const lv = level(s.remaining, s.total);
    html += `<tr><td>${sw(s.color)}</td>
      <td>${esc(s.label)}<div class="mute small">${esc(s.vendor)}${s.tags ? "" : " · ohne Tag"}</div></td>
      <td class="num">${fmtG(s.remaining)} g<span class="mini ${lv.cls}"><i style="width:${lv.pct}%"></i></span></td>
      <td class="small">${esc(s.location)}</td></tr>`;
  }
  $("#inv").innerHTML = html || '<tr><td colspan="4" class="mute">Keine Spulen gefunden</td></tr>';
}

/* ---------- Ereignisse ---------- */
function renderEvents(st) {
  if (!changed("events", st.events)) return;
  const li = (e) => `<li><span class="t">${new Date(e.t*1000).toLocaleTimeString("de-CH")}</span><span class="${e.level}">${esc(e.text)}</span></li>`;
  $("#events").innerHTML = st.events.slice(0, 8).map(li).join("") || '<li class="mute">Noch nichts passiert</li>';
  const old = st.events.slice(8);
  $("#events-old").innerHTML = old.map(li).join("");
  $("#moreev").style.display = old.length ? "" : "none";
}

async function refresh() {
  if (busy) return;
  try {
    state = await (await fetch("/api/state")).json();
    $("#ver").textContent = state.version ? "v" + state.version : "";
    renderUnknown(state); renderScales(state); renderPrinters(state); renderInventory(state); renderEvents(state);
  } catch (e) { /* Bridge kurz nicht erreichbar */ }
}
$("#q").addEventListener("input", () => state && renderInventory(state));
$("#grp").addEventListener("change", () => state && renderInventory(state));
refresh(); setInterval(refresh, 1000);
</script>
</body>
</html>
