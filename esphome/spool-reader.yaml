# ESPHome-Firmware für einen NFC-Leser (ESP32-S3 + PN532 im SPI-Modus).
# Für jeden Leser eine Kopie anlegen und nur die substitutions anpassen.
#
# Verdrahtung PN532 -> ESP32-S3 DevKitC-1:
#   VCC -> 3V3   GND -> GND
#   SCK -> GPIO12   MISO -> GPIO13   MOSI -> GPIO11   SS/CS -> GPIO10
# PN532-DIP-Schalter auf SPI stellen (meist: Schalter 1 = OFF, Schalter 2 = ON – Aufdruck prüfen).

substitutions:
  name: spool-reader-x2d      # Gerätename im Netz
  reader_id: x2d              # muss in config.yaml unter readers stehen
  bridge_url: http://truenas.local:8099/api/scan
  led_pin: GPIO48             # RGB-LED auf dem DevKitC-1 (je nach Board-Revision GPIO48 oder GPIO38)

esphome:
  name: ${name}

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: esp-idf

logger:
api:
ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: ${name}

http_request:
  verify_ssl: false
  timeout: 10s

spi:
  clk_pin: GPIO12
  miso_pin: GPIO13
  mosi_pin: GPIO11

light:
  - platform: esp32_rmt_led_strip
    id: status_led
    pin: ${led_pin}
    num_leds: 1
    chipset: ws2812
    rgb_order: GRB
    default_transition_length: 0s

pn532_spi:
  cs_pin: GPIO10
  update_interval: 500ms
  on_tag:
    then:
      # kurz weiss: Tag gelesen
      - light.turn_on: { id: status_led, red: 40%, green: 40%, blue: 40% }
      - http_request.post:
          url: ${bridge_url}
          request_headers:
            Content-Type: application/json
          json:
            reader: ${reader_id}
            uid: !lambda return x;
          on_response:
            then:
              - if:
                  condition:
                    lambda: return response->status_code == 200;
                  then:
                    # grün: Spule erkannt (am Klipper gesetzt bzw. am X2D bereit zum Einstecken)
                    - light.turn_on: { id: status_led, red: 0%, green: 80%, blue: 0% }
                  else:
                    - if:
                        condition:
                          lambda: return response->status_code == 404;
                        then:
                          # gelb: unbekannter Tag -> im Web-UI zuweisen
                          - light.turn_on: { id: status_led, red: 80%, green: 50%, blue: 0% }
                        else:
                          # rot: Fehler
                          - light.turn_on: { id: status_led, red: 80%, green: 0%, blue: 0% }
              - delay: 2s
              - light.turn_off: status_led
          on_error:
            then:
              - light.turn_on: { id: status_led, red: 80%, green: 0%, blue: 0% }
              - delay: 2s
              - light.turn_off: status_led
