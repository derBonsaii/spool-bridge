# ESPHome-Firmware: NFC-Leser MIT WAAGE (ESP32-WROOM-32 + PN532 über I2C + HX711 + Wägezelle)
# und optionalem OLED-Display 0.96" SSD1306 (wie FilaMan).
# Spule auf den Teller legen -> Tag und Gewicht werden gelesen -> Bridge trägt die Restmenge
# in Spoolman ein (Bruttogewicht minus Leergewicht der Spule). Ohne Gewicht auf dem Teller
# (Spule nur an den Leser gehalten) funktioniert der Leser wie die Variante ohne Waage.
#
# Verdrahtung PN532 (4-Pin-Header) -> ESP32-WROOM-32 DevKit:
#   GND        -> GND
#   VCC        -> 3V3
#   TXD (=SDA) -> GPIO21
#   RXD (=SCL) -> GPIO22
# PN532-DIP-Schalter auf I2C stellen: Schalter 1 = ON, Schalter 2 = OFF (Aufdruck prüfen).
#
# Verdrahtung HX711 -> ESP32-WROOM-32:
#   VCC -> 3V3   GND -> GND   DT (DOUT) -> GPIO16   SCK -> GPIO17
# Wägezelle -> HX711: rot E+, schwarz E-, weiss A-, grün A+ (bei negativem Gewicht A+/A- tauschen
# oder einfach so lassen: die Kalibrierung gleicht das Vorzeichen aus).
#
# Optional: OLED 0.96" SSD1306 128x64 (I2C, auch gelb/blaue Variante; bei Adresse 0x3D unten anpassen) – teilt sich die I2C-Pins mit dem PN532:
#   VCC -> 3V3   GND -> GND   SDA -> GPIO21   SCL -> GPIO22
# Ohne Display läuft alles gleich, ESPHome meldet dann nur eine Warnung im Log.
#
# Optional: Touch-Taster TTP223 (wie bei FilaMan) für Tara direkt am Gerät:
#   VCC -> 3V3   GND -> GND   I/O -> GPIO25
# Ohne Taster einfach nicht anschliessen, die Firmware läuft trotzdem.
#
# Die Pins entsprechen dem FilaMan-System (HX711 16/17, PN532 21/22), das Gehäuse passt also.
# PN532 IRQ/RESET (bei FilaMan 32/33) werden hier nicht gebraucht.
#
# Bedienung ohne Display über die Weboberfläche des ESP: http://<IP-des-ESP>/
#   1. Teller leer -> "Tara" drücken
#   2. Bekanntes Gewicht auflegen, bei "Kalibriergewicht" eintragen -> "Kalibrieren" drücken
#   Die Werte bleiben nach einem Neustart erhalten. Danach Tara nur noch bei Bedarf.
#
# Rückmeldung über die blaue Onboard-LED (GPIO2):
#   1x lang   = Spule erkannt (Gewicht eingetragen, X2D: jetzt einstecken / SV08: aktiv gesetzt)
#   2x kurz   = unbekannter Tag -> im Web-UI der Bridge zuweisen
#   5x schnell = Fehler (Bridge nicht erreichbar o.ä.)

substitutions:
  name: spool-waage-x2d       # Gerätename im Netz
  reader_id: x2d              # muss in config.yaml unter readers stehen
  bridge: http://truenas.local:8099   # Adresse der Bridge (ohne /api/...)
  led_pin: GPIO2              # Onboard-LED der meisten WROOM-32-DevKits
  min_weight: "30"            # darunter gilt der Teller als leer (Gramm)
  settle_ms: 1500ms           # Wartezeit nach dem Auflegen, bis das Gewicht ruhig ist

esphome:
  name: ${name}

esp32:
  board: esp32dev
  framework:
    type: esp-idf

logger:
api:
ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: ${name}

captive_portal:

web_server:
  port: 80
  version: 3

globals:
  - id: current_tag       # Tag, der gerade auf der Waage liegt
    type: std::string
    restore_value: false
    initial_value: '""'
  - id: last_pushed       # zuletzt an die Bridge gemeldetes Gewicht
    type: float
    restore_value: false
    initial_value: "NAN"
  - id: push_ticks
    type: int
    restore_value: false
    initial_value: "0"
  - id: line_top          # Hersteller + Material bzw. Status
    type: std::string
    restore_value: false
    initial_value: '"Bereit"'
  - id: line_name         # Filament-Name / Farbe
    type: std::string
    restore_value: false
    initial_value: '""'
  - id: line_bottom       # Restgewicht + nächster Schritt
    type: std::string
    restore_value: false
    initial_value: '""'
  - id: tare_raw
    type: float
    restore_value: true
    initial_value: "0"
  - id: scale_factor        # Rohwert pro Gramm
    type: float
    restore_value: true
    initial_value: "0"

sensor:
  - platform: hx711
    id: scale_raw
    name: "Waage Rohwert"
    dout_pin: GPIO16
    clk_pin: GPIO17
    gain: 128
    update_interval: 200ms
    entity_category: diagnostic
    filters:
      - median:
          window_size: 5
          send_every: 1
  - platform: template
    id: spool_weight
    name: "Gewicht"
    unit_of_measurement: g
    accuracy_decimals: 0
    update_interval: 500ms
    lambda: |-
      if (id(scale_factor) == 0 || isnan(id(scale_raw).state)) return NAN;
      return (id(scale_raw).state - id(tare_raw)) / id(scale_factor);

number:
  - platform: template
    id: cal_weight
    name: "Kalibriergewicht"
    unit_of_measurement: g
    min_value: 10
    max_value: 5000
    step: 1
    initial_value: 1000
    optimistic: true
    restore_value: true
    mode: box

font:
  - file: "gfonts://Roboto"
    id: font_small
    size: 11
    glyphsets: [GF_Latin_Core]
  - file: "gfonts://Roboto@700"
    id: font_big
    size: 22
    glyphs: "0123456789-.g "

display:
  - platform: ssd1306_i2c
    model: "SSD1306 128x64"
    address: 0x3C
    update_interval: 500ms
    lambda: |-
      // Layout für gelb/blaue 0.96"-OLEDs: Pixelzeilen 0-15 gelb, 16-63 blau.
      // Gelb: Material (oder Status). Blau: Name/Farbe, Live-Gewicht (brutto), Rest + nächster Schritt.
      it.print(0, 1, id(font_small), id(line_top).c_str());
      it.print(0, 17, id(font_small), id(line_name).c_str());
      float w = id(spool_weight).state;
      if (isnan(w)) {
        it.print(64, 29, id(font_big), TextAlign::TOP_CENTER, "--");
      } else {
        it.printf(64, 29, id(font_big), TextAlign::TOP_CENTER, "%.0f g", w);
      }
      it.print(0, 53, id(font_small), id(line_bottom).c_str());

binary_sensor:
  - platform: gpio
    name: "Tara-Taster"
    pin:
      number: GPIO25
      mode: INPUT_PULLDOWN
    filters:
      - delayed_on: 50ms
    on_press:
      - button.press: tare_button

button:
  - platform: template
    id: tare_button
    name: "Tara"
    on_press:
      - globals.set:
          id: tare_raw
          value: !lambda return id(scale_raw).state;
  - platform: template
    name: "Kalibrieren"
    on_press:
      - lambda: |-
          float diff = id(scale_raw).state - id(tare_raw);
          if (id(cal_weight).state > 0 && diff != 0) {
            id(scale_factor) = diff / id(cal_weight).state;
            ESP_LOGI("waage", "Kalibriert: %.3f Rohwert/g", id(scale_factor));
          } else {
            ESP_LOGW("waage", "Kalibrieren fehlgeschlagen: erst Tara, dann Gewicht auflegen");
          }

http_request:
  verify_ssl: false
  timeout: 3s

i2c:
  sda: GPIO21
  scl: GPIO22
  scan: true          # im ESPHome-Log muss ein Gerät auf 0x24 erscheinen
  frequency: 100kHz

output:
  - platform: gpio
    pin: ${led_pin}
    id: led_out

light:
  - platform: binary
    id: status_led
    output: led_out

script:
  - id: status_reset
    mode: restart
    then:
      - delay: 15s
      - lambda: |-
          id(line_top) = "Bereit";
          id(line_name) = "";
          id(line_bottom) = "";
  - id: blink_ok
    mode: restart
    then:
      - light.turn_on: status_led
      - delay: 1500ms
      - light.turn_off: status_led
  - id: blink_unknown
    mode: restart
    then:
      - repeat:
          count: 2
          then:
            - light.turn_on: status_led
            - delay: 200ms
            - light.turn_off: status_led
            - delay: 200ms
  - id: blink_error
    mode: restart
    then:
      - repeat:
          count: 5
          then:
            - light.turn_on: status_led
            - delay: 80ms
            - light.turn_off: status_led
            - delay: 80ms

# Gewicht laufend an die Bridge melden (bei Änderung sofort, sonst alle 2 s).
# Die Bridge führt damit das Restgewicht nach, zeigt das Live-Gewicht auf ihrer
# Statusseite und schickt in der Antwort Befehle zurück (Tara / Kalibrieren).
interval:
  - interval: 1s
    then:
      - if:
          condition:
            lambda: |-
              float w = id(spool_weight).state;
              float last = id(last_pushed);
              bool changed = (isnan(w) != isnan(last)) || (!isnan(w) && fabsf(w - last) >= 1.0f);
              id(push_ticks) += 1;
              if (changed || id(push_ticks) >= 2) {
                id(push_ticks) = 0;
                id(last_pushed) = w;
                return true;
              }
              return false;
          then:
            - http_request.post:
                url: ${bridge}/api/weight
                request_headers:
                  Content-Type: application/json
                json:
                  reader: ${reader_id}
                  uid: !lambda return id(current_tag);
                  weight: !lambda |-
                    float w = id(spool_weight).state;
                    if (isnan(w)) return std::string("");
                    return str_sprintf("%.1f", w);
                capture_response: true
                max_response_buffer_size: 256
                on_response:
                  then:
                    - lambda: |-
                        // Befehl aus der Antwort: {"cmd": "tare"} oder {"cmd": "cal:1250.0"}
                        std::string k = "\"cmd\": \"";
                        size_t p = body.find(k);
                        if (p == std::string::npos) return;
                        p += k.size();
                        size_t e = body.find('"', p);
                        if (e == std::string::npos) return;
                        std::string cmd = body.substr(p, e - p);
                        if (cmd == "tare") {
                          id(tare_raw) = id(scale_raw).state;
                          ESP_LOGI("waage", "Tara (von der Bridge)");
                        } else if (cmd.rfind("cal:", 0) == 0) {
                          float g = atof(cmd.substr(4).c_str());
                          float diff = id(scale_raw).state - id(tare_raw);
                          if (g > 0 && diff != 0) {
                            id(scale_factor) = diff / g;
                            auto call = id(cal_weight).make_call();
                            call.set_value(g);
                            call.perform();
                            ESP_LOGI("waage", "Kalibriert (von der Bridge): %.3f Rohwert/g", id(scale_factor));
                          } else {
                            ESP_LOGW("waage", "Kalibrieren fehlgeschlagen: erst Tara, dann Gewicht auflegen");
                          }
                        }

pn532_i2c:
  update_interval: 500ms
  on_tag_removed:
    then:
      - lambda: id(current_tag) = "";
  on_tag:
    then:
      - lambda: id(current_tag) = x;
      - lambda: |-
          id(line_top) = "Lese...";
          id(line_name) = "";
          id(line_bottom) = "";
      # kurz warten, bis die Spule ruhig liegt und das Gewicht stabil ist
      - delay: ${settle_ms}
      - http_request.post:
          url: ${bridge}/api/scan
          request_headers:
            Content-Type: application/json
          json:
            reader: ${reader_id}
            uid: !lambda return x;
            weight: !lambda |-
              float w = id(spool_weight).state;
              if (isnan(w) || w < ${min_weight}) return std::string("");
              return str_sprintf("%.1f", w);
          capture_response: true
          max_response_buffer_size: 1kB
          on_response:
            then:
              - lambda: |-
                  // Werte aus der JSON-Antwort der Bridge fürs Display holen
                  auto field = [&](const char *key) -> std::string {
                    std::string k = std::string("\"") + key + "\": \"";
                    size_t p = body.find(k);
                    if (p == std::string::npos) return "";
                    p += k.size();
                    size_t e = body.find('"', p);
                    return e == std::string::npos ? "" : body.substr(p, e - p);
                  };
                  auto cut = [](std::string t) { return t.size() > 21 ? t.substr(0, 21) : t; };
                  std::string result = field("result");
                  std::string vendor = field("vendor");
                  std::string material = field("material");
                  std::string name = field("name");
                  std::string rest = field("remaining");
                  std::string next = "";
                  if (result == "armed") next = "ins AMS";
                  else if (result == "assigned") next = "gesetzt";
                  else if (result == "weighed") next = "gewogen";
                  if (result == "unknown") {
                    id(line_top) = "Neuer Tag";
                    id(line_name) = "im Web zuweisen";
                    id(line_bottom) = "";
                  } else if (next.empty()) {
                    id(line_top) = "Fehler";
                    id(line_name) = "";
                    id(line_bottom) = "";
                  } else {
                    // Material oben, Name/Farbe darunter – ohne Hersteller und Nummer
                    if (!material.empty() && name.rfind(material, 0) == 0) material = "";
                    id(line_top) = cut(material.empty() ? name : material);
                    id(line_name) = cut(material.empty() ? "" : name);
                    id(line_bottom) = cut(rest.empty() ? next : "Rest " + rest + " g - " + next);
                  }
              - script.execute: status_reset
              - if:
                  condition:
                    lambda: return response->status_code == 200;
                  then:
                    - script.execute: blink_ok
                  else:
                    - if:
                        condition:
                          lambda: return response->status_code == 404;
                        then:
                          - script.execute: blink_unknown
                        else:
                          - script.execute: blink_error
          on_error:
            then:
              - lambda: |-
                  id(line_top) = "Bridge offline";
                  id(line_name) = "";
                  id(line_bottom) = "";
              - script.execute: status_reset
              - script.execute: blink_error
